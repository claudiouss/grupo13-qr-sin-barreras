<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fichas de apoyo</title>
<style>
body { margin:0; font-family: system-ui, Arial, sans-serif; background:#f4f6f8; color:#14213d; font-size:19px; line-height:1.45; }
main { max-width:560px; margin:0 auto; padding:16px; }
.aviso { background:#14213d; color:#fff; padding:14px 16px; border-radius:12px; }
h1 { font-size:32px; margin:18px 0 0; }
.sub { color:#4a5568; margin:2px 0 14px; }
h2 { font-size:20px; margin:22px 0 8px; color:#0b5394; }
.llamar { display:block; background:#1b7f3b; color:#fff; text-decoration:none; padding:16px; border-radius:12px; margin:10px 0; font-size:21px; font-weight:bold; }
.llamar small { display:block; font-weight:normal; font-size:16px; }
.azul { background:#0b5394; }
.caja { background:#fff; border-radius:12px; padding:12px 16px; border:1px solid #d9dee5; margin-bottom:8px; }
.evitar { border-left:6px solid #c27c0e; }
.pie { font-size:14px; color:#4a5568; margin-top:26px; }
.ficticio { background:#fff3cd; border:1px solid #e0b84d; border-radius:8px; padding:8px; font-size:14px; text-align:center; }
</style>
</head>
<body>
<main>
<h1>Fichas de apoyo – Fundación Sin Barreras</h1>
<p>Las fichas solo se abren escaneando el código QR que porta cada persona.</p>
<p>Contacto: +56 2 0000 0000</p>
<p class="ficticio">PROTOTIPO ACADÉMICO – DATOS FICTICIOS – Programación 2, Grupo 13</p>
</main>
</body>
